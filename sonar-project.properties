# The scanner runs once from the repository root. Each source tree is listed
# once; coverage reports from the three test jobs are imported below.
sonar.sources=backend,facial-recognition,frontend/src,src
sonar.tests=backend,facial-recognition,frontend/tests
sonar.test.inclusions=backend/**/test_*.py,backend/**/tests.py,backend/**/tests_*.py,facial-recognition/test_*.py,facial-recognition/tests_*.py,frontend/tests/**/*.test.js
sonar.exclusions=**/migrations/**,**/node_modules/**,**/dist/**,**/coverage/**,**/__pycache__/**,backend/**/test_*.py,backend/**/tests_*.py,backend/**/tests.py,facial-recognition/test_*.py,facial-recognition/tests_*.py,frontend/tests/**,src/imports/pasted_text/**
sonar.python.coverage.reportPaths=coverage-reports/backend/coverage.xml,coverage-reports/facial-recognition/coverage.xml
sonar.javascript.lcov.reportPaths=coverage-reports/frontend/lcov.info
