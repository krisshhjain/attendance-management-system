services:

  db:
    image: postgres:16
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: attendance_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: attendance_user
      RABBITMQ_DEFAULT_PASS: attendance_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: attendance_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: amqp://attendance_user:attendance_password@rabbitmq:5672//
      HR_COPILOT_LLM_URL: http://host.docker.internal:11434
      FACE_SERVICE_URL: http://host.docker.internal:8001
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    profiles:
      - full

  celery_worker:
    build: ./backend
    container_name: attendance_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: amqp://attendance_user:attendance_password@rabbitmq:5672//
      HR_COPILOT_LLM_URL: http://host.docker.internal:11434
      FACE_SERVICE_URL: http://host.docker.internal:8001
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python -m celery -A config worker -l info --pool=solo
    profiles:
      - full

  celery_beat:
    build: ./backend
    container_name: attendance_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: amqp://attendance_user:attendance_password@rabbitmq:5672//
      HR_COPILOT_LLM_URL: http://host.docker.internal:11434
      FACE_SERVICE_URL: http://host.docker.internal:8001
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python -m celery -A config beat -l info
    profiles:
      - full

  frontend:
    build: ./frontend
    container_name: attendance_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - full


  mailpit:
    image: axllent/mailpit
    container_name: attendance_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    profiles:
      - full

volumes:
  postgres_data:
  rabbitmq_data:
