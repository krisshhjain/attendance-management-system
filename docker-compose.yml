# Local development stack. Production deployments must use the platform's
# secret manager and an HTTPS-terminating reverse proxy.
services:

  db:
    image: postgres:16
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance_db}
      POSTGRES_USER: ${DB_USER:-attendance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-attendance_user} -d ${DB_NAME:-attendance_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: attendance_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: attendance_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: attendance_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:?Set DJANGO_ENV in the root .env file}
      POSTGRES_DB: ${DB_NAME:-attendance_db}
      POSTGRES_USER: ${DB_USER:-attendance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: amqp://attendance_user:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the root .env file}@rabbitmq:5672//
      HR_COPILOT_LLM_URL: http://host.docker.internal:11434
      FACE_SERVICE_URL: http://host.docker.internal:8001
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    profiles:
      - full

  celery_worker:
    build: ./backend
    container_name: attendance_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:?Set DJANGO_ENV in the root .env file}
      POSTGRES_DB: ${DB_NAME:-attendance_db}
      POSTGRES_USER: ${DB_USER:-attendance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: amqp://attendance_user:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the root .env file}@rabbitmq:5672//
      HR_COPILOT_LLM_URL: http://host.docker.internal:11434
      FACE_SERVICE_URL: http://host.docker.internal:8001
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python -m celery -A config worker -l info --pool=solo
    profiles:
      - full

  celery_beat:
    build: ./backend
    container_name: attendance_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:?Set DJANGO_ENV in the root .env file}
      POSTGRES_DB: ${DB_NAME:-attendance_db}
      POSTGRES_USER: ${DB_USER:-attendance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: amqp://attendance_user:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the root .env file}@rabbitmq:5672//
      HR_COPILOT_LLM_URL: http://host.docker.internal:11434
      FACE_SERVICE_URL: http://host.docker.internal:8001
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python -m celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    profiles:
      - full

  frontend:
    build: ./frontend
    container_name: attendance_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:8080"
    depends_on:
      - backend
    profiles:
      - full


  mailpit:
    image: axllent/mailpit
    container_name: attendance_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    profiles:
      - full

volumes:
  postgres_data:
  rabbitmq_data:
